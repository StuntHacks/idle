<div class="particle-conversion">
    <div class="title">
        <translated-string class="section-title">stages.quantum.energy.conversion.title</translated-string>
        <span class="info">
            <tool-tip orientation="right" class="particle-conversion">
                <translated-string>stages.quantum.energy.conversion.information</translated-string>
            </tool-tip>
            <i class="material-symbols-outlined">help</i>
        </span>
        <translated-string class="section-title" id="active-converters"></translated-string>
    </div>
    <div class="converters">
        <particle-converter class="red" interval="5000" target="energy_gain">
            <div class="input">
                <div class="circle">
                    <div class="resource particle quark main red"></div>
                    <div class="resource particle quark main red"></div>
                    <div class="resource particle quark main red"></div>
                </div>
                <stat-info name="conversion_input" floored></stat-info>
            </div>
            <div class="arrow">
                <span class="interval"></span>
            </div>
            <div class="output"></div>
        </particle-converter>
        <particle-converter class="green" interval="10000" target="field_gain">
            <div class="input">
                <div class="circle">
                    <div class="resource particle quark main green"></div>
                    <div class="resource particle quark main green"></div>
                    <div class="resource particle quark main green"></div>
                </div>
                <stat-info name="conversion_input" floored></stat-info>
            </div>
            <div class="arrow">
                <span class="interval"></span>
            </div>
            <div class="output"></div>
        </particle-converter>
        <particle-converter class="blue" interval="20000" target="conversion_input">
            <div class="input">
                <div class="circle">
                    <div class="resource particle quark main blue"></div>
                    <div class="resource particle quark main blue"></div>
                    <div class="resource particle quark main blue"></div>
                </div>
                <stat-info name="conversion_input" floored></stat-info>
            </div>
            <div class="arrow">
                <span class="interval"></span>
            </div>
            <div class="output"></div>
        </particle-converter>
        <particle-converter class="rgb" interval="40000" target="conversion_speed">
            <div class="input">
                <div class="circle">
                    <div class="resource particle quark main rgb"></div>
                    <div class="resource particle quark main rgb"></div>
                    <div class="resource particle quark main rgb"></div>
                </div>
                <stat-info name="conversion_input" floored></stat-info>
            </div>
            <div class="arrow">
                <span class="interval"></span>
            </div>
            <div class="output"></div>
        </particle-converter>
    </div>
</div>
