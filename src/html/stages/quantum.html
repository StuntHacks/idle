<stage-tab id="tab-quantum">
    <section class="resources" id="quantum-resource-gain-container"></section>
    <nav class="sub-tabs">
        <span data-tab="energy" id="quantum-tab-energy">
            <tool-tip center orientation="bottom" class="energy-subtab">
                <currency-display design="plain" name="energy" inferred></currency-display>
            </tool-tip>
            <translated-string>stages.quantum.tabs.energy</translated-string>
        </span>
        <span data-tab="forces" class="disabled">
            <tool-tip center orientation="bottom" class="forces-subtab">
                <span class="flavor-text">
                    <translated-string>misc.unlockedAt</translated-string>
                    <translated-string>misc.unlocks.quantum.forces</translated-string>
                </span>
                <currency-display counter max="1000000" design="plain" name="quarks-rgb" inferred>
                    <div class="resource particle quark main rgb"></div>
                </currency-display>
            </tool-tip>
            <translated-string>stages.quantum.tabs.forces</translated-string>
        </span>
        <span data-tab="hadrons" class="disabled">
            <tool-tip center orientation="bottom">
                <translated-string class="flavor-text">misc.locked</translated-string>
            </tool-tip>
            <translated-string>stages.quantum.tabs.hadrons</translated-string>
        </span>
        <span data-tab="mass" class="disabled">
            <tool-tip center orientation="bottom">
                <translated-string class="flavor-text">misc.locked</translated-string>
            </tool-tip>
            <translated-string>stages.quantum.tabs.mass</translated-string>
        </span>
    </nav>
    <section class="tab-background"></section>
    <section class="tab" data-tab="energy">
        @include('./quantum/energy_tab.html')
    </section>
    <section class="tab" data-tab="fields">
        @include('./quantum/fields_tab.html')
    </section>
    <div class="fields stage-main-content" id="quantum-fields-container"></div>
</stage-tab>
